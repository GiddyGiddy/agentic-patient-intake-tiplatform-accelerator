name: CD

# Runs after CI succeeded on main: builds the images once on GitHub-hosted runners, tags them
# with the 12-char commit SHA and pushes them to GHCR (ghcr.io/<owner>/intake/<image>).
# Deployment is pull-based: on the server run `deploy/deploy.sh <env> <tag>` (see docs/cd-setup.md).
# Images are signed with cosign only when the COSIGN_PRIVATE_KEY secret is set.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
          - name: mock-ti-gateway
            context: mock-ti-services/mock-ti-gateway
          - name: mock-id-dienst
            context: mock-ti-services/mock-id-dienst
          - name: mock-kim-cm
            context: mock-ti-services/mock-kim-cm
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      HAS_COSIGN: ${{ secrets.COSIGN_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Compute image name
        id: img
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REGISTRY="${{ vars.REGISTRY }}"
          REGISTRY="${REGISTRY:-ghcr.io/$OWNER/intake}"
          echo "ref=$REGISTRY/${{ matrix.name }}:${SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Registry login (GHCR)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build
        run: |
          docker build ${{ matrix.name == 'frontend' && format('--build-arg REACT_APP_API_URL={0} --build-arg REACT_APP_OIDC_ISSUER={1} --build-arg REACT_APP_OIDC_CLIENT_ID={2}', vars.PROD_API_URL, vars.PROD_OIDC_ISSUER, vars.PROD_OIDC_CLIENT_ID) || '' }} \
            --label org.opencontainers.image.revision=${SHA} \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            -t "${{ steps.img.outputs.ref }}" ${{ matrix.context }}

      - name: Scan image (Trivy, fixable HIGH/CRITICAL fail the publish)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push
        run: docker push "${{ steps.img.outputs.ref }}"

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.img.outputs.ref }}
          artifact-name: sbom-${{ matrix.name }}.spdx.json

      - name: Install cosign
        if: env.HAS_COSIGN == 'true'
        uses: sigstore/cosign-installer@v3
      - name: Sign image
        if: env.HAS_COSIGN == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${{ steps.img.outputs.ref }}"

  summary:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Show deploy command
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "### Images published" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy on the server: \`REGISTRY=<registry> ./deploy/deploy.sh staging ${SHA:0:12}\`" >> "$GITHUB_STEP_SUMMARY"
