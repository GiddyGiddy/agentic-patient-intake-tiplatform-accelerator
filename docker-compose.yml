services:
  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:${BACKEND_PORT:-8000}
        REACT_APP_OIDC_ISSUER: http://localhost:8081
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: agentic_backend
    environment:
      - OIDC_ISSUER=http://mock-id-dienst:8081
      - OIDC_JWKS_URL=http://mock-id-dienst:8081/jwks
      - LLM_BASE_URL=${LLM_BASE_URL:-http://llm:11434}
      - LLM_MODEL=${LLM_MODEL:-llama3.1}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      # all KIS/ePA calls go through the mock TI gateway (SMC-B signature + Telematik-ID)
      - FHIR_BASE_URL=http://mock-ti-gateway:8082/fhir
      - EPA_BASE_URL=http://mock-ti-gateway:8082/fhir
      - KIM_SMTP_HOST=mock-kim-cm
      - KIM_SMTP_PORT=2525
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-intake}:${POSTGRES_PASSWORD:-intake}@postgres:5432/${POSTGRES_DB:-intake}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mock-kim-cm:
        condition: service_started
      mock-ti-gateway:
        condition: service_started
      mock-id-dienst:
        condition: service_started
    networks:
      - ti-network

  # Single persistent store: sessions, consent records, audit log, KIM outbox
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intake}
      POSTGRES_DB: ${POSTGRES_DB:-intake}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intake} -d ${POSTGRES_DB:-intake}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ti-network

  llm:
    image: docker.io/ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - ti-network

  mock-id-dienst:
    build: ./mock-ti-services/mock-id-dienst
    ports:
      - "8081:8081"
    networks:
      - ti-network

  mock-kis-fhir:
    image: docker.io/hapiproject/hapi:latest
    ports:
      - "8080:8080"
    networks:
      - ti-network
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.allow_external_references: "true"

  # Simulated TI gateway with HSM-B/SMC-B identity: signs requests, adds X-TI-Telematik-ID
  mock-ti-gateway:
    build: ./mock-ti-services/mock-ti-gateway
    environment:
      UPSTREAM_FHIR_URL: http://mock-kis-fhir:8080/fhir
    ports:
      - "8082:8082"
    depends_on:
      - mock-kis-fhir
    networks:
      - ti-network

  # Seeds Patient, Slot and ePA MedicationStatement test data into the mock (KIS + ePA)
  mock-kis-seed:
    image: docker.io/library/python:3.12-alpine
    volumes:
      - ./mock-ti-services/mock-kis-fhir/seed.py:/seed.py:ro
    command: ["python", "/seed.py"]
    environment:
      FHIR_BASE_URL: http://mock-kis-fhir:8080/fhir
    depends_on:
      - mock-kis-fhir
    networks:
      - ti-network
    restart: "no"

 # NEU: Das simulierte KIM-Clientmodul
  mock-kim-cm:
    build: ./mock-ti-services/mock-kim-cm
    container_name: mock_kim_client_module
    ports:
      - "2525:2525" # SMTP port of the mock (see smtp_server.py), exposed for debugging
    networks:
      - ti-network

volumes:
  ollama-data:
  pg-data:
networks:
  ti-network:
