# Production stack for the on-premise server (Podman / docker compose compatible).
# No mocks, no published backend/DB ports, images only (pulled from the on-prem registry by tag).
#
#   REGISTRY=registry.klinik.local/intake IMAGE_TAG=<sha> \
#   PROD_ENV_FILE=/etc/intake/prod.env \
#   podman compose -f compose.prod.yml up -d
#
# Secrets and site-specific values live in PROD_ENV_FILE (outside the repo, chmod 600,
# see deploy/prod.env.example). Nothing secret is stored in this file.

services:
  proxy:
    image: docker.io/library/nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_DIR:-/etc/intake/tls}:/etc/nginx/tls:ro   # fullchain.pem + privkey.pem from the internal CA
    depends_on:
      - frontend
      - backend
    networks: [edge, internal]

  frontend:
    image: ${REGISTRY}/frontend:${IMAGE_TAG}
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    networks: [internal]

  backend:
    image: ${REGISTRY}/backend:${IMAGE_TAG}
    restart: unless-stopped
    env_file: ${PROD_ENV_FILE:-/etc/intake/prod.env}
    environment:
      AUTH_DISABLED: "false"
      DB_AUTO_CREATE: "false"   # schema is owned by Alembic (deploy.sh runs `alembic upgrade head`)
    volumes:
      # SMC-B / HSM-B client certificate for the real TI gateway, read-only
      - ${SMCB_CERT_DIR:-/etc/intake/smcb}:/run/smcb:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "__import__('urllib.request',fromlist=['urlopen']).urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [internal, ti]

  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    env_file: ${PROD_ENV_FILE:-/etc/intake/prod.env}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ${BACKUP_DIR:-/var/backups/intake}:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    networks: [internal]          # never published, not reachable from outside

  # Local LLM stays on-premise too (patient data must not leave the building).
  llm:
    image: docker.io/ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks: [internal]

volumes:
  pg-data:
  ollama-data:

networks:
  edge:
  internal:
    internal: true                # no direct internet access for frontend/DB/LLM
  ti:                             # backend only: route to TI gateway, IdP and KIM client module
