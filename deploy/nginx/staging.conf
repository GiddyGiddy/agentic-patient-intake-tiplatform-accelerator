# Staging-only extra listeners on the proxy (mounted by compose.staging.yml; never used in production).
#   :3000  the UI over TLS (an alternative to :443; crypto.subtle for PKCE needs a secure context, so no plain HTTP)
#   :8443  the mock IdP over TLS, so the browser can log in; the frontend image must be built with
#          REACT_APP_OIDC_ISSUER=https://<vm>:8443 (repo variable PROD_OIDC_ISSUER)

server {
  listen 3000 ssl;
  http2 on;

  ssl_certificate     /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
  }
}

server {
  listen 8443 ssl;
  http2 on;

  ssl_certificate     /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  location / {
    proxy_pass http://mock-id-dienst:8081;
    proxy_set_header Host $host;
  }
}
